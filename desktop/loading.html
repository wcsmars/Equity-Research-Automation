<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Equity Research Automation</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #080b12;
        color: #e6edf6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        -webkit-app-region: drag; /* lets the frameless area be draggable */
      }
      .brand {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .brand span {
        color: #5b9dff;
      }
      .sub {
        font-size: 13px;
        color: #62748f;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid #243043;
        border-top-color: #5b9dff;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner"></div>
      <div class="brand">Equity Research <span>Automation</span></div>
      <div class="sub">Starting the valuation engine and the analyst…</div>
    </div>
  </body>
</html>
